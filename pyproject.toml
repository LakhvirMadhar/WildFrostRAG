[project]
name = "wildfrostrag"
version = "0.1.0"
description = ""
authors = [
    {name = "Lakhvir Madhar",email = "171702328+LakhvirMadhar@users.noreply.github.com"}
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "bs4 (>=0.0.2,<0.0.3)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "neo4j (>=6.0.3,<7.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "langchain (>=1.2.0,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-text-splitters (>=1.1.0,<2.0.0)",
    "openai (>=2.14.0,<3.0.0)",
    "sentence-transformers (>=5.2.0,<6.0.0)",
    "ipython (>=9.8.0,<10.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)",
    "ollama (>=0.6.1,<0.7.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "neo4j-graphrag (>=1.12.0,<2.0.0)",
    "ruff (>=0.14.13,<0.15.0)"
]


[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*.ipynb", ".claude/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "S", "B", "C4", "C90", "ANN"]
ignore = ["D100", "D104", "D212", "N805", "E902", "I001", "E501", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.poetry]
package-mode = true
packages = [
    {include = "wildfrost_rag", from = "src"},
]

[tool.poetry.group.dev.dependencies]
mypy = "1.20.0"
pytest = "^9.0.2"
pre-commit = "^4.0.0"
graphviz = "^0.21"
import-linter = "^2.13"
testcontainers = {extras = ["neo4j"], version = "^4.15.0"}

[virtualenvs]
in-project = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
no_implicit_optional = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
pretty = true
explicit_package_bases = true
mypy_path = "src"

[tool.importlinter]
root_package = "wildfrost_rag"

[[tool.importlinter.contracts]]
name = "No import cycles within wildfrost_rag's packages/submodules"
type = "acyclic_siblings"
ancestors = ["wildfrost_rag"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
