name: CI

on: [push, pull_request]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock
      - run: poetry install
      - run: poetry run pytest --doctest-modules src/ tests/
        env:
          # Settings() currently validates eagerly at import time (see
          # docs/migration_plan - T1.0), so importing almost anything
          # requires these to be set even though this job never connects
          # to a real database. Fake values only satisfy Pydantic's
          # required-field check for import-checking purposes.
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: fake
          NEO4J_PASSWORD: fake
