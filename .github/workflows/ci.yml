name: CI

on: [push, pull_request]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy src/
      - run: PYTHONPATH=src poetry run lint-imports

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock
      - run: poetry install
      - uses: actions/cache@v4
        id: nltk-cache
        with:
          path: ~/nltk_data
          key: nltk-stopwords-v1
      - if: steps.nltk-cache.outputs.cache-hit != 'true'
        run: poetry run python -m nltk.downloader stopwords
      - run: poetry run pytest --doctest-modules src/ tests/
